<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editeur de reperes</title>
<style>
:root{--bg:#0f1220;--panel:#181c2e;--line:#2b3150;--txt:#ece6d8;--mut:#a39d90;--acc:#e2b854}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui,sans-serif;display:flex;height:100vh}
aside{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}
h1{font-size:17px;margin:0 0 10px;color:var(--acc)}
h2{font-size:13px;margin:16px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
label{display:block;margin:6px 0}
input[type=text],input[type=number],select{width:100%;padding:6px;background:#0c0f1a;color:var(--txt);border:1px solid var(--line);border-radius:6px}
input[type=color]{width:100%;height:30px;border:0;background:none}
button{width:100%;margin:4px 0;padding:8px;border:1px solid var(--line);border-radius:6px;background:#232946;color:var(--txt);cursor:pointer}
button.main{background:var(--acc);color:#1a1405;font-weight:600;border-color:var(--acc)}
.row{display:flex;gap:6px}.row>*{flex:1}
.help{color:var(--mut);font-size:12.5px;line-height:1.45}
main{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px}
canvas{max-width:100%;height:auto;box-shadow:0 0 0 1px var(--line);cursor:crosshair;background:#000}
#list div{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}
#list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list a{color:#ff8a7a;cursor:pointer;text-decoration:none}
</style>
</head>
<body>
<aside>
  <h1>Reperes de la carte</h1>
  <label>Image de la carte (capture des Abysses)<input type="file" id="file" accept="image/*"></label>

  <h2>Quadrillage</h2>
  <div class="row">
    <label>Colonnes<input type="number" id="cols" value="8" min="0" max="26"></label>
    <label>Lignes<input type="number" id="rows" value="8" min="0" max="30"></label>
  </div>
  <label>Couleur<input type="color" id="gridColor" value="#ffffff"></label>

  <h2>Nouveau repere</h2>
  <label>Nom (vide = numero auto)<input type="text" id="name" placeholder="ex : Forteresse, Pont nord"></label>
  <div class="row">
    <label>Type<select id="kind">
      <option value="pt">Point</option>
      <option value="rally">Regroupement</option>
      <option value="danger">Danger</option>
      <option value="obj">Objectif</option>
    </select></label>
    <label>Taille<input type="number" id="size" value="22" min="10" max="80"></label>
  </div>

  <h2>Reperes</h2>
  <div id="list" class="help">Aucun.</div>
  <button id="undo">Annuler le dernier</button>
  <button id="clear">Tout effacer</button>

  <h2>Export</h2>
  <label>Nom du fichier<input type="text" id="out" value="01-abysses.png"></label>
  <button class="main" id="save">Enregistrer l'image PNG</button>
  <p class="help">Clic : poser un repere. Glisser : le deplacer. Clic droit : le supprimer.<br>
  Mets le PNG dans le dossier <b>cartes</b> de la Carte des Abysses : elle se recharge seule.</p>
</aside>
<main><canvas id="cv" width="1200" height="900"></canvas></main>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let img=null,marks=[],drag=-1,moved=false;
const COLORS={pt:'#ffffff',rally:'#5fd38a',danger:'#ff5a4e',obj:'#e2b854'};
const KEY='carte-reperes-v1';

function save(){try{localStorage.setItem(KEY,JSON.stringify({marks,cols:$('cols').value,rows:$('rows').value,gridColor:$('gridColor').value}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d)return;marks=d.marks||[];$('cols').value=d.cols;$('rows').value=d.rows;$('gridColor').value=d.gridColor}catch(e){}}

function draw(){
  if(img){cv.width=img.naturalWidth;cv.height=img.naturalHeight;cx.drawImage(img,0,0)}
  else{cx.fillStyle='#1b2033';cx.fillRect(0,0,cv.width,cv.height);cx.fillStyle='#a39d90';cx.font='28px system-ui';cx.textAlign='center';cx.fillText('Charge une capture de la carte des Abysses',cv.width/2,cv.height/2)}
  const W=cv.width,H=cv.height,c=+$('cols').value,r=+$('rows').value,u=Math.max(W,H)/1000;
  if(c>0&&r>0){
    cx.save();cx.strokeStyle=$('gridColor').value;cx.globalAlpha=.45;cx.lineWidth=Math.max(1,1.5*u);
    for(let i=1;i<c;i++){const x=W*i/c;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,H);cx.stroke()}
    for(let j=1;j<r;j++){const y=H*j/r;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}
    cx.globalAlpha=1;cx.fillStyle=$('gridColor').value;cx.font=`700 ${Math.round(20*u)}px system-ui`;cx.textAlign='center';cx.textBaseline='top';
    cx.shadowColor='#000';cx.shadowBlur=4*u;
    for(let i=0;i<c;i++)cx.fillText(String.fromCharCode(65+i),W*(i+.5)/c,6*u);
    cx.textAlign='left';cx.textBaseline='middle';
    for(let j=0;j<r;j++)cx.fillText(String(j+1),6*u,H*(j+.5)/r);
    cx.restore();
  }
  marks.forEach((m,i)=>{
    const s=m.size*u,col=COLORS[m.kind]||'#fff';
    cx.save();cx.shadowColor='#000';cx.shadowBlur=6*u;
    cx.beginPath();
    if(m.kind==='danger'){cx.moveTo(m.x,m.y-s);cx.lineTo(m.x+s,m.y+s*.8);cx.lineTo(m.x-s,m.y+s*.8);cx.closePath()}
    else if(m.kind==='obj'){cx.moveTo(m.x,m.y-s);cx.lineTo(m.x+s,m.y);cx.lineTo(m.x,m.y+s);cx.lineTo(m.x-s,m.y);cx.closePath()}
    else cx.arc(m.x,m.y,s*.75,0,7);
    cx.fillStyle=col;cx.fill();cx.lineWidth=2.5*u;cx.strokeStyle='#111';cx.stroke();
    cx.shadowBlur=0;cx.fillStyle='#111';cx.font=`800 ${Math.round(s*.8)}px system-ui`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillText(String(i+1),m.x,m.y+(m.kind==='danger'?s*.25:0));
    if(m.name){
      cx.font=`700 ${Math.round(s*.95)}px system-ui`;cx.textAlign='left';
      const tx=m.x+s*1.15,tw=cx.measureText(m.name).width;
      cx.fillStyle='rgba(10,12,20,.78)';cx.fillRect(tx-4*u,m.y-s*.65,tw+8*u,s*1.3);
      cx.fillStyle=col;cx.fillText(m.name,tx,m.y);
    }
    cx.restore();
  });
  const l=$('list');
  l.innerHTML=marks.length?'':'Aucun.';
  marks.forEach((m,i)=>{const d=document.createElement('div');const sp=document.createElement('span');sp.textContent=(i+1)+'. '+(m.name||'(sans nom)');const a=document.createElement('a');a.textContent='suppr.';a.onclick=()=>{marks.splice(i,1);save();draw()};d.append(sp,a);l.append(d)});
}
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}}
function hit(p){const u=Math.max(cv.width,cv.height)/1000;for(let i=marks.length-1;i>=0;i--){const m=marks[i];if(Math.hypot(p.x-m.x,p.y-m.y)<m.size*u)return i}return -1}
cv.addEventListener('mousedown',e=>{if(e.button!==0)return;const p=pos(e);drag=hit(p);moved=false;
  if(drag<0){marks.push({x:p.x,y:p.y,name:$('name').value.trim(),kind:$('kind').value,size:+$('size').value||22});$('name').value='';save();draw()}});
cv.addEventListener('mousemove',e=>{if(drag<0)return;const p=pos(e);marks[drag].x=p.x;marks[drag].y=p.y;moved=true;draw()});
addEventListener('mouseup',()=>{if(drag>=0&&moved)save();drag=-1});
cv.addEventListener('contextmenu',e=>{e.preventDefault();const i=hit(pos(e));if(i>=0){marks.splice(i,1);save();draw()}});
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const i=new Image();i.onload=()=>{img=i;draw()};i.src=URL.createObjectURL(f)};
['cols','rows','gridColor'].forEach(id=>$(id).oninput=()=>{save();draw()});
$('undo').onclick=()=>{marks.pop();save();draw()};
$('clear').onclick=()=>{marks=[];save();draw()};
$('save').onclick=()=>{cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=$('out').value.trim()||'01-abysses.png';a.click()},'image/png')};
load();draw();
</script>
</body>
</html>
