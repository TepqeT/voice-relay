<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;font-weight:700;src:url(cinzel-latin-700-normal.woff2)}
@font-face{font-family:Cinzel;font-weight:900;src:url(cinzel-latin-900-normal.woff2)}
html,body{margin:0;width:1600px;height:640px;overflow:hidden;background:#0b0b14}
.wrap{position:relative;width:1600px;height:640px;font-family:Inter,sans-serif}
svg{position:absolute;inset:0}
.title{position:absolute;left:0;right:0;top:120px;text-align:center;font-family:Cinzel;font-weight:900;font-size:138px;letter-spacing:10px;color:#fff;
 text-shadow:0 3px 0 rgba(30,15,45,.55),0 0 22px rgba(30,10,40,.55),0 0 50px rgba(255,214,140,.35)}
.title .r{color:#ffd98a}
.sub{position:absolute;left:0;right:0;top:320px;text-align:center;font-family:Cinzel;font-weight:700;font-size:34px;letter-spacing:12px;color:#e9e6f5}
.flag{position:absolute;left:650px;top:298px;width:300px;height:6px;display:flex;border-radius:3px;overflow:hidden;box-shadow:0 0 12px rgba(255,255,255,.4)}
.flag i{flex:1}
.side{position:absolute;bottom:80px;font-family:Cinzel;font-weight:900;font-size:58px;letter-spacing:6px}
.side small{display:block;font-family:Inter;font-weight:700;font-size:20px;letter-spacing:8px;opacity:.85;margin-bottom:6px}
.el{left:90px;color:#fff6dc;text-shadow:0 0 18px rgba(255,210,120,.8)}
.el small{color:#ffe3a1}
.as{right:90px;text-align:right;color:#efe4ff;text-shadow:0 0 18px rgba(170,90,255,.9)}
.as small{color:#d6b8ff}
.mid{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:Inter;font-weight:600;font-size:22px;letter-spacing:6px;color:#c9c6d8}
</style></head><body><div class="wrap">
<svg width="1600" height="640" viewBox="0 0 1600 640">
 <defs>
  <linearGradient id="ely" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9c97e"/><stop offset=".45" stop-color="#b7832f"/><stop offset="1" stop-color="#2c4f86"/></linearGradient>
  <linearGradient id="asm" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0f4a"/><stop offset=".5" stop-color="#5b1a6e"/><stop offset="1" stop-color="#8a1230"/></linearGradient>
  <radialGradient id="core" cx="50%" cy="48%" r="45%"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".5" stop-color="#9f7bff" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
 <polygon points="0,0 900,0 700,640 0,640" fill="url(#ely)"/>
 <polygon points="900,0 1600,0 1600,640 700,640" fill="url(#asm)"/>
 <rect width="1600" height="640" fill="url(#core)"/>
 <rect width="1600" height="640" fill="url(#shade)"/>
 <line x1="900" y1="0" x2="700" y2="640" stroke="#fff" stroke-opacity=".75" stroke-width="3" filter="url(#glow)"/>
 <g id="bars" filter="url(#glow)"></g>
 <g id="dust"></g>
</svg>
<div class="title"><span class="r">R</span>v<span class="r">R</span> FRANCE</div>
<div class="flag"><i style="background:#2b4bd1"></i><i style="background:#ffffff"></i><i style="background:#e0283c"></i></div>
<div class="sub">RELAIS VOCAL INTER-LÉGIONS</div>
<div class="side el"><small>ELYOS</small>SERVER</div>
<div class="side as"><small>ASMODIENS</small>TRINIEL</div>
<div class="mid">UNE VOIX, TOUTES LES LÉGIONS</div>
</div>
<script>
const ns="http://www.w3.org/2000/svg", bars=document.getElementById('bars'), dust=document.getElementById('dust');
// voice waveform bars along the horizon, louder in the center
for(let i=0;i<52;i++){const x=388+i*16.25, d=Math.abs(x-800)/420, h=(Math.sin(i*1.7)*0.5+0.6)*(1-d*0.85)*95+8;
 const r=document.createElementNS(ns,'rect');r.setAttribute('x',x);r.setAttribute('y',465-h/2);r.setAttribute('width',6);r.setAttribute('height',h);r.setAttribute('rx',3);
 r.setAttribute('fill',x<800?'#fff1c9':'#d7b8ff');r.setAttribute('opacity',(0.18+0.35*(1-d)).toFixed(2));bars.appendChild(r);}
let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
for(let i=0;i<140;i++){const c=document.createElementNS(ns,'circle');const x=rnd()*1600,y=rnd()*640;c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',(rnd()*1.8+0.4).toFixed(2));
 c.setAttribute('fill',x<800?'#fff6d8':'#e7d4ff');c.setAttribute('opacity',(rnd()*0.6+0.2).toFixed(2));dust.appendChild(c);}
</script></body></html>
