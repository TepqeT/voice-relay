# Voice Relay est arrete (21/11/2026). Il ne reste que Caddy, pour les mises a
# jour de DaevaTool (/maj/) et la page "Projet arrete".
name: voice-relay

services:
  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    container_name: voice-relay-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/daevatool-maj:/srv/maj:ro          # mises a jour DaevaTool (daevatool-maj.sh)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
