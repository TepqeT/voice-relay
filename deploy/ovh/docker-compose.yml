# Voice Relay sur le VPS : bot principal + bots relais + site d'administration
# + HTTPS automatique. Une seule instance, sans faction.
# A lancer depuis ce dossier (deploy/ovh du depot clone sur le VPS).
#   Premier lancement / mise a jour : ./mettre-a-jour.sh   (APPLY=false puis true)
#   Logs                          : docker compose logs -f relay   (ou caddy)
#   Arret                         : docker compose down
# Secrets : .env dans ce dossier, jamais versionne (voir .env.example).

name: voice-relay

x-relay: &relay
  image: voice-relay:local
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-rvr-env: &rvr-env
  # Dates des abonnements et des journaux a l'heure francaise
  TZ: Europe/Paris
  STORE_PATH: /data/store.yaml
  LOG_LEVEL: info
  SESSION_IDLE_TIMEOUT: 30m
  PRIORITY_SPEAKER: "true"
  SOUNDS_DIR: /sounds
  SOUND_ON_START: debut
  SOUND_ON_STOP: fin
  REPORT_TO_DISCORD: "true"
  REPORT_LANG: en
  REPORTS_DIR: /data/reports
  DIAG_DIR: /data/diagnostics
  DIAG_INTERVAL: 10s
  SQUAD_LEAD_ROLE: "Squad Lead"
  SQUAD_LEAD_KEY: always
  SQUAD_LEADS_TO_SQUADS: "true"
  RAID_LEAD_ROLE: "Raid Lead"
  # EVENT_LABEL: "RvR"
  DYNAMIC_CHANNELS: "true"
  # Salon texte ou le panneau de commande (Start, Stop, Status) reste affiche
  # en permanence ; cree par le bot s'il manque, en lecture seule pour les
  # membres. Langue du serveur choisie dans /setup, anglais par defaut.
  PANEL_CHANNEL: "raid-panel"
  RAID_LEAD_CHANNEL: "Raid Lead"
  SQUAD_CHANNEL: "Squad"
  SQUAD_COUNT: "5"
  VOICE_REGION: ""
  # CLASS_ROLES: "Gladiateur, Templier, Assassin, Rodeur, Sorcier, Spiritualiste, Clerc, Aede"
  # WAITING_CHANNEL: "Attente"
  # CLASS_RULE: "balanced"

services:
  # Bot principal + bots relais (tokens dans .env). Sert aussi le site.
  relay:
    <<: *relay
    build: ../..
    container_name: voice-relay
    env_file: .env
    environment:
      <<: *rvr-env
      # Pas de faction : la categorie s'appelle "RvR" et les commandes
      # "RvR: ..." (en francais pour les clients Discord en francais). Le role
      # d'acces est cree par le bot depuis le site (etape Roles) et accorde
      # par le Board : clic droit > Applications. Noms en anglais par defaut.
      ACCESS_ROLE: "Raid Access"
      BOARD_ROLE: "Raid Board"
      # Site d'administration (v29), joint par caddy sur le reseau interne
      # uniquement. DISCORD_CLIENT_SECRET vient de .env.
      WEB_ADDR: ":8080"
      WEB_BASE_URL: "https://${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}"
      # Support (v31) : bouton "Contacter le support" du site. Vide = profil
      # Discord du proprietaire de l'application (message prive ou ajout ami).
      # SUPPORT_URL: "https://discord.com/users/123456789012345678"
      # Paiement (v31) : lien PayPal du bouton "Payer avec PayPal", par exemple
      # https://www.paypal.com/paypalme/votre-nom ; vide = pas de bouton.
      PAYPAL_URL: "${PAYPAL_URL:-}"
      PRICE_LABEL: "${PRICE_LABEL:-}"
      # Abonnements (v30), dans data/subscriptions.json. Le proprietaire de
      # l'application Discord administre le site ; autres administrateurs :
      # SITE_ADMINS: "123456789012345678"
      # true : un serveur sans abonnement actif ne peut plus lancer de raid.
      # Avant d'activer : s'offrir un abonnement a vie et l'activer sur Aion 2 France.
      # SUBSCRIPTION_REQUIRED: "true"
    expose:
      - "8080"
    volumes:
      - ./data:/data
      # Sons personnalises : copier le dossier sounds ici puis decommenter.
      # - ./sounds:/sounds:ro

  # HTTPS : certificat Let's Encrypt obtenu et renouvele automatiquement.
  caddy:
    image: caddy:2.10.0-alpine
    container_name: voice-relay-caddy
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/daevatool-maj:/srv/maj:ro          # mises a jour DaevaTool (daevatool-maj.sh)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
