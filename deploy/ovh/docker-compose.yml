# Voice Relay sur le VPS : bot principal + bots relais + site d'administration
# + HTTPS automatique. Une seule instance.
# A lancer depuis ce dossier (deploy/ovh du depot clone sur le VPS).
#   Premier lancement / mise a jour : ./mettre-a-jour.sh   (APPLY=false puis true)
#   Logs                          : docker compose logs -f relay   (ou caddy)
#   Arret                         : docker compose down
# Secrets : .env dans ce dossier, jamais versionne (voir .env.example).

name: voice-relay

x-relay: &relay
  image: voice-relay:local
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-relay-env: &relay-env
  # Dates des abonnements et des journaux a l'heure francaise
  TZ: Europe/Paris
  STORE_PATH: /data/store.yaml
  LOG_LEVEL: info
  SESSION_IDLE_TIMEOUT: 30m
  PRIORITY_SPEAKER: "true"
  SOUNDS_DIR: /sounds
  # Sons de debut et de fin de session : aucun fourni, voir sounds/README.md.
  # SOUND_ON_START: start
  # SOUND_ON_STOP: stop
  REPORT_TO_DISCORD: "true"
  REPORT_LANG: en
  REPORTS_DIR: /data/reports
  DIAG_DIR: /data/diagnostics
  DIAG_INTERVAL: 10s
  # Qui entend qui : le bot principal capte le salon Speaker (role Speaker
  # seulement) et chaque bot relais diffuse dans son salon Listener. Le
  # Squad Lead de chaque salon Listener est entendu dans le salon Speaker
  # (jamais dans les autres Listener) ; les Speakers coupent ce retour depuis
  # le panneau, salon par salon ou en entier.
  SPEAKER_ROLE: "Speaker"
  SQUAD_LEAD_ROLE: "Squad Lead"
  SQUAD_LEAD_KEY: always
  DYNAMIC_CHANNELS: "true"
  # Categorie permanente : salon du panneau + salons vocaux de la session.
  CATEGORY: "VOICE"                # server A : catégorie existante, reprise telle quelle
  # Salon texte ou le panneau de commande reste affiche en permanence ; cree
  # par le bot s'il manque, en lecture seule pour les membres. Langue du
  # serveur choisie dans /setup, anglais par defaut.
  PANEL_CHANNEL: "bot-commands"    # server A : salon existant, repris tel quel
  SPEAKER_CHANNEL: "Speaker"
  LISTENER_CHANNEL: "Listener"
  # Un salon Listener par bot relais disponible (11 aujourd'hui) ; un nombre
  # pour en limiter le nombre.
  LISTENER_COUNT: "all"
  VOICE_REGION: ""
  # Tri par classe (facultatif) : roles de classe, salon d'attente, regle.
  # CLASS_ROLES: "Tank, Healer, DPS"
  # WAITING_CHANNEL: "Waiting"
  # CLASS_RULE: "balanced"

services:
  # Bot principal + bots relais (tokens dans .env). Sert aussi le site.
  relay:
    <<: *relay
    build: ../..
    container_name: voice-relay
    env_file: .env
    environment:
      <<: *relay-env
      # Role d'acces aux salons Listener en mode restreint, cree par le bot
      # depuis le site (etape Roles). Speakers et Squad Leads valident les
      # demandes depuis le panneau et peuvent ouvrir les salons a tout le
      # monde. BOARD_ROLE (facultatif) ajoute un role qui valide les acces.
      ACCESS_ROLE: "Listener Access"
      # BOARD_ROLE: "Board"
      # Site d'administration (v29), joint par caddy sur le reseau interne
      # uniquement. DISCORD_CLIENT_SECRET vient de .env.
      WEB_ADDR: ":8080"
      WEB_BASE_URL: "https://${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}"
      # Support (v31) : bouton "Contacter le support" du site. Vide = profil
      # Discord du proprietaire de l'application (message prive ou ajout ami).
      # SUPPORT_URL: "https://discord.com/users/123456789012345678"
      # Dons (v62) : Voice Relay est gratuit. Lien PayPal.me du bouton
      # "Faire un don", par exemple https://www.paypal.com/paypalme/votre-nom ;
      # vide = pas de bouton.
      PAYPAL_URL: "${PAYPAL_URL:-}"
      # Dons sur le site, prioritaires sur PAYPAL_URL : le visiteur choisit un
      # montant et paie dans la fenetre PayPal (compte PayPal ou carte),
      # l'argent arrive sur le compte PayPal de l'application. Identifiants
      # dans .env (PAYPAL_CLIENT_ID, PAYPAL_CLIENT_SECRET).
      PAYPAL_MODE: "${PAYPAL_MODE:-sandbox}"
      PAYPAL_CURRENCY: "EUR"
      DONATION_AMOUNTS: "${DONATION_AMOUNTS:-3,5,10,20}"
      # Abonnements (v30), dans data/subscriptions.json. Le proprietaire de
      # l'application Discord administre le site ; autres administrateurs :
      # SITE_ADMINS: "123456789012345678"
      # true : un serveur sans abonnement actif ne peut plus lancer de session.
      # Avant d'activer : s'offrir un abonnement a vie et l'activer sur son serveur.
      # SUBSCRIPTION_REQUIRED: "true"
    expose:
      - "8080"
    volumes:
      - ./data:/data
      # Sons personnalises : copier le dossier sounds ici puis decommenter.
      # - ./sounds:/sounds:ro

  # HTTPS : certificat Let's Encrypt obtenu et renouvele automatiquement.
  caddy:
    # Version figee par son empreinte : le meme binaire a chaque mise a jour.
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    container_name: voice-relay-caddy
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN manquant dans .env}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant dans .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/daevatool-maj:/srv/maj:ro          # mises a jour DaevaTool (daevatool-maj.sh)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
